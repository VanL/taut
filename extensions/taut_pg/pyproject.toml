[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taut-pg"
version = "0.8.2"
description = "Postgres support package for Taut"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
license-files = ["LICENSE"]
authors = [
    {name = "Van Lindberg", email = "van.lindberg@gmail.com"},
]
dependencies = [
    "taut-chat>=0.8.2",
    "simplebroker-pg>=3.5.1",
]

[project.entry-points."taut.search_backends"]
postgres = "taut_pg.search_manifest:postgres"

[project.optional-dependencies]
dev = [
    "mypy>=1.0",
    "pytest>=7.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.0",
    "ruff==0.16.1",
]

[tool.uv.sources]
taut-chat = { path = "../..", editable = true }

[tool.hatch.build]
include = [
    "/taut_pg/**/*.py",
    "/taut_pg/py.typed",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
    "pg_only: tests that validate the Postgres extension package",
]
