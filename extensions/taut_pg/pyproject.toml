[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taut-pg"
version = "0.9.4"
description = "Postgres support package for Taut"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
license-files = ["LICENSE"]
authors = [
    {name = "Van Lindberg", email = "van.lindberg@gmail.com"},
]
dependencies = [
    "taut-chat>=0.9.4",
    "simplebroker-pg>=3.8.0",
]

[project.entry-points."taut.search_backends"]
postgres = "taut_pg.search_manifest:postgres"

[project.optional-dependencies]
dev = [
    "build>=1.5.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.3",
    "taut-tui>=0.9.4",
]

[tool.uv.sources]
taut-chat = { path = "../..", editable = true }
taut-tui = { path = "../taut_tui", editable = true }

[tool.hatch.build]
include = [
    "/taut_pg/**/*.py",
    "/taut_pg/py.typed",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
    "pg_only: tests that validate the Postgres extension package",
]
