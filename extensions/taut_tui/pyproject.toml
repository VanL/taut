[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taut-tui"
version = "0.9.2"
description = "Human-first terminal interface extension for Taut"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
license-files = ["LICENSE"]
authors = [
    {name = "Van Lindberg", email = "van.lindberg@gmail.com"},
]
dependencies = [
    "taut-chat>=0.9.2",
    "textual>=8.2.8",
]

[project.entry-points."taut.commands"]
tui = "taut_tui.command_manifest:tui"

[project.optional-dependencies]
dev = [
    "build>=1.5.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.3",
    "taut-summon>=0.9.2",
]

[tool.uv.sources]
taut-chat = { path = "../..", editable = true }
taut-summon = { path = "../taut_summon", editable = true }

[tool.hatch.build]
include = [
    "/taut_tui/**/*.py",
    "/taut_tui/py.typed",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
    "sqlite_only: tests that validate built-in SQLite/path behavior",
    "tui_only: tests that validate the TUI",
]

[tool.mypy]
python_version = "3.11"
no_namespace_packages = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
extend-select = ["E", "W", "F", "I", "B", "C901", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["taut", "taut_tui"]

[tool.ruff.lint.mccabe]
max-complexity = 10
