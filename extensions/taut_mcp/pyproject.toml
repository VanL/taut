[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taut-mcp"
version = "0.9.2"
description = "MCP extension for attaching agent sessions to Taut workspaces"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
license-files = ["LICENSE"]
authors = [
    {name = "Van Lindberg", email = "van.lindberg@gmail.com"},
]
dependencies = [
    "jsonschema>=4.26.0,<5",
    "mcp>=2.0.0,<3",
    "taut-chat>=0.9.2",
]

[project.scripts]
taut-mcp = "taut_mcp.cli:main"

[project.entry-points."taut.commands"]
mcp = "taut_mcp.command_manifest:mcp"

[project.optional-dependencies]
dev = [
    "build>=1.5.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.3",
    "taut-pg>=0.9.2",
    "taut-summon>=0.9.2",
    "types-psutil>=7.2.2.20260518",
    "types-jsonschema>=4.26.0.20260518",
]

[tool.uv.sources]
taut-chat = { path = "../..", editable = true }
taut-pg = { path = "../taut_pg", editable = true }
taut-summon = { path = "../taut_summon", editable = true }

[tool.hatch.build]
include = [
    "/taut_mcp/**/*.py",
    "/taut_mcp/py.typed",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers -n auto --dist loadgroup"
markers = [
    "installed_wheel: tests that build and run isolated installed artifacts",
    "pg_only: tests that validate the Postgres extension package",
    "sqlite_only: tests that validate built-in SQLite/path behavior",
]

[tool.mypy]
python_version = "3.11"
no_namespace_packages = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
extend-select = ["E", "W", "F", "I", "B", "C901", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["taut", "taut_mcp"]

[tool.ruff.lint.mccabe]
max-complexity = 10
