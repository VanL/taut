name: Release

on:
  workflow_call:
    inputs:
      package_dir:
        description: Package directory whose manifest verifies the artifact.
        required: true
        type: string
      tag_name:
        description: Release tag to publish and attach artifacts to.
        required: true
        type: string
      release_ref:
        description: Git ref to check out for publication.
        required: true
        type: string
      expected_tag_commit:
        description: Commit SHA the release tag is expected to reference.
        required: true
        type: string
      evidence_run_id:
        description: Canonical Test workflow run that produced the artifact.
        required: true
        type: string
      evidence_run_attempt:
        description: Canonical Test workflow attempt that produced the artifact.
        required: true
        type: string
      evidence_branch:
        description: Canonical branch recorded on the producing workflow.
        required: true
        type: string
      artifact_prefix:
        description: Attempt-qualified artifact name prefix.
        required: true
        type: string
      artifact_id:
        description: Immutable GitHub Actions artifact id.
        required: true
        type: string
      artifact_digest:
        description: GitHub archive sha256 digest from artifact metadata.
        required: true
        type: string
      artifact_repository_id:
        description: Numeric repository id recorded on the artifact.
        required: true
        type: string
      artifact_head_repository_id:
        description: Numeric head-repository id recorded on the artifact.
        required: true
        type: string
      carried_artifact_name:
        description: Same-run artifact name for the verified inner bundle.
        required: true
        type: string
    outputs:
      carried_artifact_id:
        description: Immutable id of the carried verified inner bundle.
        value: ${{ jobs.stage-release.outputs.carried_artifact_id }}

jobs:
  stage-release:
    name: Stage verified artifact as draft GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    outputs:
      carried_artifact_id: ${{ steps.carry.outputs.artifact-id }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        timeout-minutes: 5
        with:
          ref: ${{ inputs.release_ref }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        timeout-minutes: 5
        with:
          python-version: "3.14"

      - name: Verify checked out commit matches tested release commit
        timeout-minutes: 2
        run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_tag_commit }}"

      - name: Reverify immutable artifact metadata
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ inputs.expected_tag_commit }}
        run: |
          python bin/require-green-workflows.py verify-artifact \
            --artifact-id "${{ inputs.artifact_id }}" \
            --artifact-digest "${{ inputs.artifact_digest }}" \
            --artifact-prefix "${{ inputs.artifact_prefix }}" \
            --run-id "${{ inputs.evidence_run_id }}" \
            --run-attempt "${{ inputs.evidence_run_attempt }}" \
            --repository-id "${{ inputs.artifact_repository_id }}" \
            --head-repository-id "${{ inputs.artifact_head_repository_id }}" \
            --branch "${{ inputs.evidence_branch }}"

      - name: Download the exact tested distribution bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        timeout-minutes: 5
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.evidence_run_id }}
          path: bundle/
          merge-multiple: true

      - name: Verify inner provenance and distribution bytes
        timeout-minutes: 2
        run: |
          python bin/release-artifact.py verify \
            --package-dir "${{ inputs.package_dir }}" \
            --bundle-dir bundle \
            --commit "${{ inputs.expected_tag_commit }}" \
            --tag-name "${{ inputs.tag_name }}" \
            --output-dir dist

      - name: Plan exact draft staging
        id: publication
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/release_publication.py stage-draft \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "${{ inputs.tag_name }}" \
            --expected-sha "${{ inputs.expected_tag_commit }}" \
            --manifest bundle/release-manifest.json \
            --dist-dir dist

      - name: Stage complete draft GitHub Release
        if: ${{ steps.publication.outputs.stage_required == 'true' }}
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        timeout-minutes: 5
        with:
          draft: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          tag_name: ${{ inputs.tag_name }}
          # The existing tag is the separately verified commit binding. Keeping
          # the nominal release target on the default branch lets GITHUB_TOKEN
          # publish the draft even if a later default-branch commit changes a
          # workflow file; GitHub otherwise requires unavailable Workflows write.
          target_commitish: ${{ github.event.repository.default_branch }}
          files: |
            dist/*.tar.gz
            dist/*.whl

      - name: Carry the verified inner bundle into publication jobs
        id: carry
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 5
        with:
          name: ${{ inputs.carried_artifact_name }}
          path: bundle/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
