name: Test MCP Extension

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.11.11"
  # One 300-second deadline is shared by both exact bodies in each command,
  # leaving time for verified cleanup inside the 15-minute step boundary.
  TAUT_MCP_DIAGNOSTIC_ABSOLUTE_CAP_SECONDS: "300"

jobs:
  diagnose-windows-aggregate:
    name: exact MCP body progress (windows, py3.13)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        timeout-minutes: 5

      - name: Set up Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        timeout-minutes: 5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        timeout-minutes: 5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            extensions/taut_mcp/pyproject.toml
            extensions/taut_mcp/uv.lock

      # Diagnostic amplification only. These repetitions do not replace or
      # relax either original test's retained 15-second deadlock valve.
      - name: Measure each exact body with minimal observer cost
        timeout-minutes: 15
        env:
          TAUT_MCP_DIAGNOSTIC_BUDGET_ITERATIONS: "20"
        run: |
          uv run --project extensions/taut_mcp --extra dev pytest extensions/taut_mcp/tests/test_windows_aggregate_diagnostic.py::test_exact_mcp_body_budget_lane -n 0 -q -s --tb=short

      - name: Locate phases and prove Windows cleanup
        timeout-minutes: 15
        env:
          TAUT_MCP_DIAGNOSTIC_PHASE_ITERATIONS: "5"
        run: |
          uv run --project extensions/taut_mcp --extra dev pytest extensions/taut_mcp/tests/test_windows_aggregate_diagnostic.py::test_exact_mcp_body_phase_lane extensions/taut_mcp/tests/test_windows_aggregate_diagnostic.py::test_diagnostic_protocol_failure_paths_and_tree_cleanup -n 0 -q -s --tb=short
