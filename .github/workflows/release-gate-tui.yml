name: Release Gate (taut-tui)

on:
  push:
    tags:
      - "taut_tui/v*"

permissions:
  actions: read
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_id: ${{ steps.observe.outputs.artifact_id }}
      artifact_digest: ${{ steps.observe.outputs.artifact_digest }}
      artifact_run_id: ${{ steps.observe.outputs.artifact_run_id }}
      artifact_run_attempt: ${{ steps.observe.outputs.artifact_run_attempt }}
      artifact_repository_id: ${{ steps.observe.outputs.artifact_repository_id }}
      artifact_head_repository_id: ${{ steps.observe.outputs.artifact_head_repository_id }}
      artifact_head_branch: ${{ steps.observe.outputs.artifact_head_branch }}
      tag_commit: ${{ steps.tag.outputs.tag_commit }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        timeout-minutes: 5

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        timeout-minutes: 5
        with:
          python-version: "3.14"

      - name: Resolve release tag commit
        id: tag
        timeout-minutes: 2
        run: |
          tag_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          [[ "${tag_commit}" =~ ^[0-9a-f]{40}$ ]]
          echo "tag_commit=${tag_commit}" >> "${GITHUB_OUTPUT}"

      - name: Observe exact-SHA workflow and artifact evidence
        id: observe
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ steps.tag.outputs.tag_commit }}
        run: |
          python bin/require-green-workflows.py wait \
            --workflow root=.github/workflows/test.yml \
            --workflow pg=.github/workflows/test-pg-extension.yml \
            --workflow mcp=.github/workflows/test-mcp-extension.yml \
            --artifact-workflow root \
            --artifact-prefix release-taut-tui

  stage-release:
    needs: release-evidence
    uses: ./.github/workflows/release.yml
    with:
      package_dir: extensions/taut_tui
      tag_name: ${{ github.ref_name }}
      release_ref: ${{ needs.release-evidence.outputs.tag_commit }}
      expected_tag_commit: ${{ needs.release-evidence.outputs.tag_commit }}
      evidence_run_id: ${{ needs.release-evidence.outputs.artifact_run_id }}
      evidence_run_attempt: ${{ needs.release-evidence.outputs.artifact_run_attempt }}
      evidence_branch: ${{ needs.release-evidence.outputs.artifact_head_branch }}
      artifact_prefix: release-taut-tui
      artifact_id: ${{ needs.release-evidence.outputs.artifact_id }}
      artifact_digest: ${{ needs.release-evidence.outputs.artifact_digest }}
      artifact_repository_id: ${{ needs.release-evidence.outputs.artifact_repository_id }}
      artifact_head_repository_id: ${{ needs.release-evidence.outputs.artifact_head_repository_id }}
      carried_artifact_name: publication-taut-tui-attempt-${{ github.run_attempt }}
    permissions:
      actions: read
      contents: write

  publish-to-pypi:
    name: Publish taut-tui to PyPI
    needs: [release-evidence, stage-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/taut-tui
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        timeout-minutes: 5
        with:
          ref: ${{ needs.release-evidence.outputs.tag_commit }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        timeout-minutes: 5
        with:
          python-version: "3.14"

      - name: Download the carried verified bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        timeout-minutes: 5
        with:
          artifact-ids: ${{ needs.stage-release.outputs.carried_artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          path: bundle/
          merge-multiple: true

      - name: Reverify inner provenance and distribution bytes
        timeout-minutes: 2
        run: |
          python bin/release-artifact.py verify \
            --package-dir extensions/taut_tui \
            --bundle-dir bundle \
            --commit "${{ needs.release-evidence.outputs.tag_commit }}" \
            --tag-name "${{ github.ref_name }}" \
            --output-dir dist

      - name: Plan exact PyPI publication
        id: publication
        timeout-minutes: 2
        run: |
          python .github/scripts/release_publication.py plan-pypi \
            --manifest bundle/release-manifest.json \
            --dist-dir dist

      - name: Recheck release tag before irreversible PyPI upload
        if: ${{ steps.publication.outputs.publish == 'true' }}
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/release_publication.py verify-tag \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "${GITHUB_REF_NAME}" \
            --expected-sha "${{ needs.release-evidence.outputs.tag_commit }}"

      - name: Publish distribution to PyPI
        if: ${{ steps.publication.outputs.publish == 'true' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: ${{ steps.publication.outputs.skip_existing }}

      - name: Recreate clean verified distributions for postflight
        timeout-minutes: 2
        run: |
          python bin/release-artifact.py verify \
            --package-dir extensions/taut_tui \
            --bundle-dir bundle \
            --commit "${{ needs.release-evidence.outputs.tag_commit }}" \
            --tag-name "${{ github.ref_name }}" \
            --output-dir postflight-dist

      - name: Verify complete exact PyPI publication
        timeout-minutes: 5
        run: |
          python .github/scripts/release_publication.py verify-pypi \
            --manifest bundle/release-manifest.json \
            --dist-dir postflight-dist

  publish-github-release:
    needs: [release-evidence, stage-release, publish-to-pypi]
    uses: ./.github/workflows/release-finalize.yml
    with:
      package_dir: extensions/taut_tui
      tag_name: ${{ github.ref_name }}
      release_ref: ${{ needs.release-evidence.outputs.tag_commit }}
      expected_tag_commit: ${{ needs.release-evidence.outputs.tag_commit }}
      carried_artifact_id: ${{ needs.stage-release.outputs.carried_artifact_id }}
    permissions:
      actions: read
      contents: write
